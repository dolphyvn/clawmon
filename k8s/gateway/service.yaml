apiVersion: v1
kind: Service
metadata:
  name: clawmon-gateway
  namespace: clawmon
  labels:
    app: clawmon-gateway
spec:
  type: ClusterIP
  ports:
  - name: websocket
    port: 18790
    targetPort: websocket
    protocol: TCP
  selector:
    app: clawmon-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: clawmon-gateway-headless
  namespace: clawmon
  labels:
    app: clawmon-gateway
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: websocket
    port: 18790
    targetPort: websocket
    protocol: TCP
  selector:
    app: clawmon-gateway
